[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.1.0"
description = "Multi-repo workspace tool: parallel git sync + task worktree scaffolder"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
